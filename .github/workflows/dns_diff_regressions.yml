name: DNS diff regressions
on: [pull_request, workflow_dispatch]

jobs:
  dns_diff_regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Set up xmake
        uses: xmake-io/setup-xmake-action@v1
        with:
          xmake-version: latest
      - name: Build dnslabctl backend
        shell: bash
        run: |
          xmake f -c
          xmake build dnslabctl
      - name: Run DNS diff regression scripts
        shell: bash
        run: |
          set -euo pipefail
          bash test/test_dns_diff_cli_smoke.sh
          bash test/test_follow_diff_pipeline.sh
          bash test/test_follow_diff_window.sh
          bash test/test_campaign_close_loop.sh
          bash test/test_replay_failure_evidence.sh
          bash test/test_triage_contract.sh
          bash test/test_campaign_report.sh
          bash test/test_multi_run_aggregate.sh
          bash test/test_publication_evidence_bundle.sh
          bash test/test_publication_readiness_audit.sh
